<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예측판 확률 카드 | YECHEUKPAN</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<!--
  예측판(YECHEUKPAN) 퍼가는 확률 카드
  · 사용법: <iframe src="https://yecheukpan.kr/embed.html?id={이슈 slug}" width="100%" height="180" ...>
  · data/markets.json(2시간마다 갱신)만 읽고, 외부 폰트·스크립트·광고를 쓰지 않는다. (경량)
  · 이 페이지 자체는 검색에 올리지 않고(noindex), 안쪽 링크로만 본 사이트에 들어오게 한다.
-->
<style>
  :root {
    --line: #E5E8EB;
    --ink: #191F28;
    --ink-2: #4E5968;
    --muted: #6B7684;
    --meta: #8B95A1;
    --navy: #1E3A8A;
    --blue: #2563EB;
    --yes: #D93025;
    --no: #1A73E8;
    --up: #D93025;
    --down: #1A73E8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
                 "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #FFFFFF;
    font-size: 13px;
    line-height: 1.45;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }
  .card {
    display: flex; flex-direction: column;
    height: 100%; min-height: 100%;
    padding: 10px 13px 9px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #FFFFFF;
  }
  .hd { display: flex; align-items: center; gap: 6px; flex: none; min-width: 0; }
  .brand {
    font-size: 10.5px; font-weight: 800; letter-spacing: -.02em; color: var(--navy);
    display: inline-flex; align-items: center; gap: 4px; flex: none;
  }
  .brand i {
    font-style: normal; width: 13px; height: 13px; border-radius: 3px;
    background: var(--navy); color: #fff; font-size: 9px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
  }
  .src {
    flex: none; font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
    border: 1px solid var(--line); color: var(--ink-2); background: #F8FAFC;
  }
  .src.kalshi { color: #7A4A00; border-color: #EEDCB8; background: #FDF7EA; }
  .src.pm { color: #15438C; border-color: #CBDCF5; background: #F4F8FF; }
  .fresh { font-size: 9.5px; color: var(--meta); flex: none; }
  .d24 { margin-left: auto; flex: none; font-size: 10.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .d24.up { color: var(--up); }
  .d24.down { color: var(--down); }
  .d24.flat, .d24.na { color: var(--meta); }

  .ttl {
    margin: 6px 0 0; flex: none;
    font-size: 13.5px; font-weight: 800; letter-spacing: -.03em; line-height: 1.32;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; text-overflow: ellipsis;
  }
  .prob { display: flex; align-items: flex-end; gap: 8px; margin-top: auto; flex: none; }
  .pv { font-size: 31px; font-weight: 800; letter-spacing: -.045em; line-height: 1; font-variant-numeric: tabular-nums; }
  .pv small { font-size: 15px; font-weight: 800; margin-left: 1px; }
  .lb { font-size: 9.5px; font-weight: 800; color: var(--meta); letter-spacing: .04em; }
  .no { margin-left: auto; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .no b { color: var(--ink-2); font-weight: 800; }
  .gauge { height: 5px; border-radius: 3px; background: #EDF0F4; overflow: hidden; margin: 6px 0 0; flex: none; }
  .gauge i { display: block; height: 100%; border-radius: 3px; background: var(--yes); transition: width .3s ease; }
  .ft {
    margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 6px; flex: none; min-width: 0;
  }
  .more {
    font-size: 10.5px; font-weight: 800; color: var(--blue);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .more:hover { text-decoration: underline; }
  .basis { margin-left: auto; flex: none; font-size: 9.5px; color: var(--meta); font-variant-numeric: tabular-nums; }
  .msg { margin: auto 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .msg b { color: var(--ink); }
  .skeleton { background: linear-gradient(90deg,#F1F4F8 25%,#E8ECF2 37%,#F1F4F8 63%); background-size: 400% 100%;
              animation: sk 1.2s ease infinite; border-radius: 4px; }
  @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  .sk-t { height: 30px; margin-top: 8px; }
  .sk-b { height: 26px; margin-top: 12px; width: 55%; }
</style>
</head>
<body>
<div class="card" id="card" aria-live="polite">
  <div class="hd">
    <span class="brand"><i aria-hidden="true">예</i>예측판</span>
    <span class="src">불러오는 중</span>
  </div>
  <div class="sk-t skeleton"></div>
  <div class="sk-b skeleton"></div>
</div>

<script>
(function () {
  "use strict";
  var CARD = document.getElementById("card");
  var SITE = "https://yecheukpan.kr";

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  // scripts/build_issue_pages.py · assets/app.js 의 issueSlug() 와 같은 규칙
  function issueSlug(key) {
    var s = String(key == null ? "" : key).trim().toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return s || "issue";
  }
  function num1(v) {
    var n = Number(v);
    return isFinite(n) ? n.toFixed(1) : "—";
  }
  function delta(v) {
    if (v === null || v === undefined || v === "" || !isFinite(Number(v))) {
      return { txt: "변동 없음", cls: "na" };
    }
    var n = Number(v);
    if (Math.abs(n) < 0.05) return { txt: "변동 없음", cls: "flat" };
    return { txt: (n > 0 ? "+" : "−") + Math.abs(n).toFixed(1) + "%p", cls: n > 0 ? "up" : "down" };
  }
  function basisTxt(data, it) {
    var label = String((data && data.updated_label) || "");
    // "2026년 11월 28일 22:53 (KST)" → "11/28 22:53"
    var m = label.match(/(\d{1,2})월\s*(\d{1,2})일\s*(\d{1,2}:\d{2})/);
    return m ? (m[1] + "/" + m[2] + " " + m[3]) : (label || "");
  }

  function fail(title, body) {
    CARD.innerHTML =
      '<div class="hd"><span class="brand"><i aria-hidden="true">예</i>예측판</span></div>' +
      '<div class="msg"><b>' + esc(title) + '</b><br>' + esc(body) + '</div>' +
      '<div class="ft"><a class="more" href="' + SITE + '/issues/" target="_blank" rel="noopener">' +
      '예측판에서 다른 이슈 보기 →</a></div>';
  }

  function render(data, it) {
    var slug = issueSlug(it.key);
    var d = delta(it.change_24h);
    var src = it.source || "Polymarket";
    var fresh = src === "Kalshi" ? "2시간 갱신" : "1분 갱신";
    var yes = Math.max(0, Math.min(100, Number(it.yes) || 0));
    CARD.innerHTML =
      '<div class="hd">' +
        '<span class="brand"><i aria-hidden="true">예</i>예측판</span>' +
        '<span class="src ' + (src === "Kalshi" ? "kalshi" : "pm") + '">' + esc(src) + '</span>' +
        '<span class="fresh">' + esc(fresh) + '</span>' +
        '<span class="d24 ' + d.cls + '">24시간 ' + esc(d.txt) + '</span>' +
      '</div>' +
      '<h1 class="ttl">' + esc(it.title) + '</h1>' +
      '<div class="prob">' +
        '<span class="lb">YES</span>' +
        '<span class="pv">' + num1(it.yes) + '<small>%</small></span>' +
        '<span class="no">NO <b>' + num1(it.no) + '%</b></span>' +
      '</div>' +
      '<div class="gauge"><i style="width:' + Math.max(2, yes).toFixed(1) + '%"></i></div>' +
      '<div class="ft">' +
        '<a class="more" href="' + SITE + '/issues/' + esc(slug) + '.html" target="_blank" rel="noopener">' +
          '예측판(yecheukpan.kr)에서 자세히 보기 →</a>' +
        '<span class="basis">' + esc(basisTxt(data, it)) + '</span>' +
      '</div>';
    document.title = it.title + " — YES " + num1(it.yes) + "% | 예측판";
  }

  var id = "";
  try {
    id = (new URLSearchParams(location.search).get("id") || "").trim().toLowerCase();
  } catch (e) {
    id = "";
  }
  if (!id) {
    fail("이슈 주소가 비어 있습니다.", "주소 끝에 ?id=이슈주소 를 붙여 주세요.");
    return;
  }

  var url = "/data/markets.json?v=" + Math.floor(Date.now() / 600000); // 10분 단위 캐시 키
  fetch(url, { credentials: "omit" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      var items = (data && data.items) || [];
      var hit = null;
      for (var i = 0; i < items.length; i++) {
        if (issueSlug(items[i].key) === id) { hit = items[i]; break; }
      }
      if (hit) render(data, hit);
      else fail("이 이슈는 지금 목록에 없습니다.", "마감·교체로 내려간 이슈일 수 있습니다. 예측판에서 다른 이슈를 볼 수 있습니다.");
    })
    .catch(function () {
      fail("확률을 불러오지 못했습니다.", "잠시 후 새로고침해 주세요.");
    });
})();
</script>
</body>
</html>
