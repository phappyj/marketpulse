<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>[검수용] 예측판 화면 미리보기</title>
<style>
  html, body { margin: 0; background: #05080d; color: #8c9ab3; font-family: -apple-system, "Segoe UI", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 10; background: #0a0d13; border-bottom: 1px solid #232e40; padding: 6px 10px; font-size: 12px; }
  .stage { display: flex; justify-content: flex-start; padding: 8px; }
  iframe { border: 0; display: block; background: #0a0d13; }
</style>
</head>
<body>
<div class="bar" id="bar">미리보기</div>
<div class="stage"><iframe id="frame" src="index.html" width="390" height="1200"></iframe></div>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var src = p.get("src") || "index.html";
    var w = parseInt(p.get("w") || "390", 10);
    var h = parseInt(p.get("h") || "1200", 10);
    var f = document.getElementById("frame");
    f.width = w; f.height = h;
    f.src = src;
    document.getElementById("bar").textContent = "검수용 미리보기 · " + w + "px · " + src;
  })();
</script>
</body>
</html>
