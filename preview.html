<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>preview frame</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  iframe { border: 0; display: block; background: #fff; }
</style>
</head>
<body>
<script>
  var p = new URLSearchParams(location.search);
  var w = p.get("w") || "390";
  var h = p.get("h") || "844";
  var u = p.get("u") || "index.html";
  document.write('<iframe src="' + u + '" style="width:' + w + "px;height:" + h + 'px" scrolling="no"></iframe>');
</script>
</body>
</html>
